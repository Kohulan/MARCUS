name: docker-images

# Build check (never pushed) for the v2 images a GitHub runner can hold: api, cpu worker, tools
# worker and the nginx edge with the web UI. Not built here: tf / torch / llama. Their CUDA
# variants (nvidia/cuda bases, CUDA torch wheels, a llama.cpp CUDA compile) run to tens of GB
# and over the runner's disk; the CPU variants still fetch GBs of model weights at build time
# (DECIMER; MolScribe 1.1 GB) and would blow the 10 GB GHA cache.
# Those images and their ML tests stay a local gate (backend-v2/README.md).

on:
  pull_request:
    paths:
      - "backend-v2/docker/**"
      - "backend-v2/pyproject.toml"
      - "backend-v2/uv.lock"
      - "backend-v2/.dockerignore"
      - "frontend-v2/Dockerfile"
      - "frontend-v2/.dockerignore"
      - "frontend-v2/package-lock.json"
      - ".github/workflows/docker-images.yml"
  push:
    branches: [main, v2-backend]
    paths:
      - "backend-v2/docker/**"
      - "backend-v2/pyproject.toml"
      - "backend-v2/uv.lock"
      - "backend-v2/.dockerignore"
      - "frontend-v2/Dockerfile"
      - "frontend-v2/.dockerignore"
      - "frontend-v2/package-lock.json"
      - ".github/workflows/docker-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: backend-v2
            file: backend-v2/docker/Dockerfile.api
            cache-mode: max
          - image: tools
            context: backend-v2
            file: backend-v2/docker/Dockerfile.tools
            cache-mode: max
          - image: nginx
            context: frontend-v2
            file: frontend-v2/Dockerfile
            cache-mode: max
          # CPU torch + docling models: several GB. Only the final layers go to the GHA
          # cache (10 GB per repo), and the runner's preinstalled SDKs are removed first.
          - image: cpu
            context: backend-v2
            file: backend-v2/docker/Dockerfile.cpu
            cache-mode: min
            free-disk: true
    steps:
      - if: matrix.free-disk
        name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: marcus-v2-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=${{ matrix.cache-mode }}
