name: release-please-action

on:
  push:
    branches:
      - main

# One run at a time: two merges in a row started two runs that both updated the release branch,
# and the slower one failed ("Error updating ref"). Queued, the newest push still runs.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # v4 reads its settings from release-please-config.json and the last released version
      # from .release-please-manifest.json (v3 took them as inputs).
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
