# One Dependabot pull request a month for every ecosystem together (a multi-ecosystem group),
# instead of one PR per ecosystem and one per major version. Security updates (on in the repo
# settings) still come as they are found. Dependabot reads this file from main.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    labels: [dependencies]

updates:
  # frontend-v2: React / Vite / vitest / Playwright (package-lock.json)
  - package-ecosystem: npm
    directory: /frontend-v2
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  # backend-v2: uv project (pyproject.toml + uv.lock)
  - package-ecosystem: uv
    directory: /backend-v2
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    ignore:
      # Pinned on purpose: PyMuPDF 1.26.7 is v1's page renderer (ruling R12); jpype1 1.5.2
      # matches the CDK jars in the tools image.
      - dependency-name: pymupdf
      - dependency-name: jpype1

  # backend-v2 images: Dockerfile.api / cpu / tools / tf / torch / llama
  - package-ecosystem: docker
    directory: /backend-v2/docker
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    ignore:
      # The project pins Python 3.11 (requires-python >=3.11.5,<3.12).
      - dependency-name: python
        versions: [">=3.12"]
      # CUDA / cuDNN bases are pinned to the TF / torch builds and the server's driver.
      - dependency-name: nvidia/cuda
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # frontend-v2 image: node build stage + nginx-unprivileged edge
  - package-ecosystem: docker
    directory: /frontend-v2
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Compose service images (postgres, redis, monitoring)
  - package-ecosystem: docker-compose
    directory: /backend-v2
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    ignore:
      # A Postgres or Redis major needs a data migration: never as a bot PR.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
