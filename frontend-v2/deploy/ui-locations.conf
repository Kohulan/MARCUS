# MARCUS v2 web UI: static locations, included inside the `server {}` of both the local dev
# nginx (deploy/dev-nginx.conf) and the production nginx. /api/v2/ is not here: each server
# defines its own proxy.
#
# Every location sets its FULL header set: an add_header inside a location drops every
# inherited one (the server-level security headers included), so nothing is inherited.
# Two policies:
#   app      (every page, /app, /assets/): the app CSP, X-Frame-Options DENY
#   Ketcher  (/ketcher/ only: the editor page, its worker and its .wasm): the Ketcher CSP,
#            X-Frame-Options SAMEORIGIN (the app frames it). A dedicated worker runs under the
#            CSP of its own script response, so the worker and the .wasm live under /ketcher/.
# Both CSPs are exact copies of Global Constraints; change them there first.

include /etc/nginx/mime.types;
root /usr/share/nginx/marcus-ui;

# Hashed, immutable build output of the app.
location ^~ /assets/ {
    try_files $uri =404;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/wasm;
    gzip_min_length 1024;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://matomo.nfdi4chem.de; connect-src 'self' https://coconut.naturalproducts.net https://pubchem.ncbi.nlm.nih.gov https://matomo.nfdi4chem.de; img-src 'self' data: blob: https://matomo.nfdi4chem.de; style-src 'self'; font-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# The Ketcher editor (separate Vite build, base /ketcher/), framed by the tool.
location ^~ /ketcher/ {
    try_files $uri /ketcher/index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/wasm;
    gzip_min_length 1024;

    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hashed Ketcher output: the bundle, the Indigo worker and the .wasm.
    location ^~ /ketcher/assets/ {
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}

# /ketcher without the slash: the editor only works at /ketcher/ (under the Ketcher headers).
# Without this, `location /` would serve ketcher/index.html under the app's headers.
# A relative Location, so the redirect keeps the scheme and host the client used (the
# production nginx sits behind the TLS proxy).
location = /ketcher {
    absolute_redirect off;
    return 301 /ketcher/;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://matomo.nfdi4chem.de; connect-src 'self' https://coconut.naturalproducts.net https://pubchem.ncbi.nlm.nih.gov https://matomo.nfdi4chem.de; img-src 'self' data: blob: https://matomo.nfdi4chem.de; style-src 'self'; font-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# The tool: /app and every /app/... path get the client-rendered shell (empty root).
# A regex, not the prefix /app, so /apple is not the tool but a 404.
location ~ ^/app(?:/|$) {
    try_files $uri /app/index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/wasm;
    gzip_min_length 1024;

    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://matomo.nfdi4chem.de; connect-src 'self' https://coconut.naturalproducts.net https://pubchem.ncbi.nlm.nih.gov https://matomo.nfdi4chem.de; img-src 'self' data: blob: https://matomo.nfdi4chem.de; style-src 'self'; font-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# Pre-rendered pages (/about and /about/ both get about/index.html) and the unhashed files
# at the root (fonts/, sample/): revalidated on every use. Anything else is the
# pre-rendered NotFound page with status 404.
location / {
    try_files $uri $uri/index.html =404;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/wasm;
    gzip_min_length 1024;

    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://matomo.nfdi4chem.de; connect-src 'self' https://coconut.naturalproducts.net https://pubchem.ncbi.nlm.nih.gov https://matomo.nfdi4chem.de; img-src 'self' data: blob: https://matomo.nfdi4chem.de; style-src 'self'; font-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
