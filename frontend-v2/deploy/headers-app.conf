# The app's security headers (every page, /app, /assets/), included in each such location of
# ui-locations.conf. The CSP is an exact copy of Global Constraints; change it there first.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://matomo.nfdi4chem.de; connect-src 'self' https://pubchem.ncbi.nlm.nih.gov https://matomo.nfdi4chem.de; img-src 'self' data: blob: https://matomo.nfdi4chem.de; style-src 'self'; font-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
