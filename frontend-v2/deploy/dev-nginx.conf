# Local nginx for e2e and manual checks (`npm run serve:local`): serves dist/ with the same
# ui-locations.conf as production and proxies /api/v2/ to the local fake stack
# (127.0.0.1:18090). Host network, loopback only. Never points at production.
# nginx-unprivileged runs as uid 101: pid and temp files in /tmp, as in the production config.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 65s;

    # The same upload guard as the stack's own nginx (the API refuses > 20 MB itself).
    client_max_body_size 21m;

    server {
        listen 127.0.0.1:18091;
        server_name _;

        include /etc/nginx/marcus/ui-locations.conf;

        location /api/v2/ {
            proxy_pass http://127.0.0.1:18090;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
