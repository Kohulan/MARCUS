<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>MARCUS · Molecular Annotation and Recognition for Curating Unravelled Structures</title>
    <meta
      name="description"
      content="MARCUS finds the chemical structures in a scientific PDF, reads them with DECIMER, MolParser or MolScribe, and helps you check them before they go into COCONUT."
    />
    <link rel="preload" href="/fonts/gmarket-mark.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/node_modules/@fontsource/geist/files/geist-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/geist-mono/files/geist-mono-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Matomo (the one tracker): a file, not inline (CSP). Before the app, so _paq exists. -->
    <script src="/matomo.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body><!--
  Contract
  - THESIS: every structure is a marked find on its page, numbered and measured like a
    drawing sheet; no generic SaaS card dashboard.
  - OWN-WORLD: light only. Drawing-sheet paper `#F4F3EA` in a hairline frame (`#B9BCB2`)
    with ruler ticks and "+" corners; ink `#1C211D`. Green `#1E4D33` leads (headings,
    links, accept, send), `#2D7A46` accepted. Bold orange `#FA3600` only for what needs
    your eyes: found-structure markers, the main action, To check; small orange text
    `#B82800`, text on orange `#141414`. Rejected and failed are charcoal (cross-out,
    hatched ground), never red. Specimen label tables and round stamps show decisions.
    Liquid-glass pill buttons: orange, green, clear. Geist UPPERCASE tight headings and
    Geist text, Geist Mono uppercase labels and numbered tags [01], Gmarket Sans wordmark.
  - STORY: the visitor reads the name spelled out, drops a PDF on the empty benzene ring
    (or tries the sample paper), and follows the tool to checked structures; how it works,
    an example review grid and the citation are on About.
  - FIRST VIEWPORT: two cells under a free-floating header (the mark and the Waterline glass
    pill: About, GitHub, Open the tool). Left, the MARCUS acrostic h1 (bold green initials,
    Geist 400 ink, "and"/"for" muted), one sentence and the mono facts line. Right, the
    benzene-ring drop zone (orange on drag-over) and "Try a sample paper" (orange glass).
    Soft sage beams behind; three porcelain footer bubbles at the bottom.
  - FORM: Survey Sheet, owner remix of Field Sheet with heronaiapp.com (2026-11-17);
    seed key 6b4eb402.
  - FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
    review, the verdict, and DESIGN.md.
-->
    <div id="root"><!--app--></div>
  </body>
</html>
