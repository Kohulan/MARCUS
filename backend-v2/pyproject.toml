[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marcus"
version = "0.2.0.dev0"
description = "MARCUS v2 backend"
requires-python = ">=3.11.5,<3.12"
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi", "uvicorn[standard]", "gunicorn", "sqlalchemy[asyncio]>=2.1.9", "asyncpg",
  "psycopg[binary]", "alembic", "redis", "celery[redis]", "python-multipart",
  "pydantic-settings", "rdkit", "prometheus-client", "pillow", "numpy", "pymupdf==1.26.7",
]
# PyMuPDF 1.26.7: v1's page renderer (ruling R12); api pins the same. torch / torchvision are
# docling's; listed here only so the cpu extra takes the CPU-only builds (sources below, R9).
cpu = [
  "pymupdf==1.26.7", "docling", "pdf2doi", "requests", "sqlalchemy[asyncio]>=2.1.9", "psycopg[binary]",
  "celery[redis]", "redis", "pydantic-settings", "rdkit", "torch", "torchvision",
]
tools = ["jpype1==1.5.2", "rdkit", "celery[redis]", "redis", "pydantic-settings"]
tf = ["sqlalchemy[asyncio]>=2.1.9", "psycopg[binary]", "celery[redis]", "redis", "pydantic-settings", "rdkit", "pillow"]
torch = ["sqlalchemy[asyncio]>=2.1.9", "psycopg[binary]", "celery[redis]", "redis", "pydantic-settings", "rdkit", "pillow"]
# The MolParser worker (docker/Dockerfile.molparser installs torch and the model stack itself).
molparser = ["sqlalchemy[asyncio]>=2.1.9", "psycopg[binary]", "celery[redis]", "redis", "pydantic-settings", "rdkit", "pillow", "pydantic"]
# opencv / scikit-image: the drawing check's tests (marcus.workers.drawing_check); scikit-image
# as worker-segment's image ships it (docker/Dockerfile.tf), opencv as docling resolves it.
dev = [
  "pytest", "pytest-asyncio", "httpx", "requests", "ruff", "fakeredis",
  "opencv-python-headless", "scikit-image==0.24.0",
]

# The cpu worker runs docling on CPU only: torch and torchvision from the PyTorch CPU index (no
# CUDA libraries in the image). The tf / torch images install their model stacks themselves
# (docker/Dockerfile.tf, Dockerfile.torch), so no other extra resolves torch.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
marcus = "marcus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marcus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "e2e: end-to-end tests needing the full stack",
  "ml: tests needing ML model packages",
]
