# MARCUS v2 edge proxy (nginxinc/nginx-unprivileged: runs as uid 101, listens on 8080).
# The only service that publishes a port. Read-only root filesystem: pid and temp files in /tmp.

# njs: the COCONUT relay's answer filter (coconut-relay.js).
load_module modules/ngx_http_js_module.so;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    server_tokens off;  # "Server: nginx", no version

    log_format edge '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    '$request_time rid=$request_id';
    access_log /dev/stdout edge;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 65s;
    client_header_timeout 15s;
    client_body_timeout 20s;  # between two reads: a trickled body holds its buffer less long
    send_timeout 60s;

    # The API refuses > 20 MB itself, but only after the body is spooled: this is the guard. Only
    # the two upload routes (exact locations below) take 21 MB; every other body (curation, tools,
    # a trailing-slash /papers/) is at most 1 MB, so nothing but a counted upload can fill /tmp.
    client_max_body_size 1m;
    client_body_buffer_size 1m;

    # Bodies are buffered here (memory: /tmp is a sized tmpfs) before the API's rate limits
    # see them, so the number of requests in progress per client address is capped: all
    # requests (perip; SSE streams and image GETs included) and uploads (POST /papers and
    # /images, whose bodies are up to 21 MB). Over the cap: 429. Behind the outer proxy every
    # client is that proxy's address unless the real_ip switch below is on (README switch day).
    # Switch day (README): behind the outer proxy, the client address comes from X-Forwarded-For
    # sent by the proxy addresses in MARCUS_REAL_IP_FROM (docker/nginx-edge.sh writes this file;
    # empty, i.e. off, by default). It must come before everything that reads $remote_addr.
    include /tmp/nginx/real_ip.conf;

    limit_conn_zone $binary_remote_addr zone=perip:10m;
    map "$request_method:$uri" $upload_key {
        "~^POST:/api/v2/(papers|images)$" $binary_remote_addr;
        default "";  # not counted
    }
    limit_conn_zone $upload_key zone=uploads:10m;
    limit_conn_status 429;
    limit_conn_log_level warn;

    # Security headers, the same values as marcus.api.security.SECURITY_HEADERS. nginx adds
    # each one only when the upstream did not send it, so API responses keep their own values
    # (e.g. the docs CSP) and nginx's own replies (413, 502, 504) still carry them.
    map $upstream_http_content_security_policy $sec_csp {
        "" "default-src 'none'; frame-ancestors 'none'";
        default "";
    }
    map $upstream_http_x_content_type_options $sec_xcto {
        "" "nosniff";
        default "";
    }
    map $upstream_http_x_frame_options $sec_xfo {
        "" "DENY";
        default "";
    }
    map $upstream_http_referrer_policy $sec_rp {
        "" "no-referrer";
        default "";
    }
    map $upstream_http_cross_origin_resource_policy $sec_corp {
        "" "same-origin";
        default "";
    }

    # Docker's DNS; `resolve` re-resolves "api" when its container is recreated (new address)
    # instead of keeping the address nginx saw at startup (nginx >= 1.27.3). valid=1s: a
    # recreated api's new address (or its absence while it is gone) is cached for a second only.
    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 2s;

    upstream marcus_api {
        zone marcus_api 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    # --- COCONUT relay (owner decision 2026-11-20) -----------------------------------------
    # COCONUT sends no CORS headers, so the browser cannot call it. nginx (on `egress`; the API
    # has no internet) relays exactly three fixed calls to the fixed host, over verified TLS.
    # The password (login) and the token (mutate) pass through and are never stored or logged:
    # no log format here holds a body, a header or a query, and the relay logs its path only.
    #
    # `resolve`: a name that does not resolve (DNS down) never keeps nginx from starting; the
    # relay answers 502 until it resolves. COCONUT's own TTL is not needed every second.
    upstream coconut {
        zone coconut 64k;
        resolver 127.0.0.11 valid=300s ipv6=off;
        server coconut.naturalproducts.net:443 resolve;
    }

    js_import coconut from /etc/nginx/marcus/coconut-relay.js;

    log_format coconut '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time rid=$request_id';

    # Only the mutate call carries the curator's token; login and search send none.
    map $uri $coconut_authorization {
        default "";
        /api/v2/coconut/reports/mutate $http_authorization;
    }

    # Per address (behind the outer proxy: per proxy until the real_ip switch is on). Login is
    # strict (credential stuffing), and capped in total too: COCONUT sees every MARCUS user as
    # this one server, so abuse through MARCUS must not get MARCUS blocked there.
    map $request_method $coconut_all {
        default all;
    }
    limit_req_zone $binary_remote_addr zone=coconut_login:1m rate=3r/m;
    limit_req_zone $coconut_all zone=coconut_login_all:64k rate=30r/m;
    limit_req_zone $binary_remote_addr zone=coconut_mutate:1m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=coconut_search:1m rate=30r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    server {
        listen 8080;
        server_name _;

        add_header Content-Security-Policy $sec_csp always;
        add_header X-Content-Type-Options $sec_xcto always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_rp always;
        add_header Cross-Origin-Resource-Policy $sec_corp always;

        # limit_conn perip / uploads: values from MARCUS_NGINX_CONN_PER_IP (64) and
        # MARCUS_NGINX_UPLOADS_PER_IP (4), written by docker/nginx-edge.sh at container start.
        include /tmp/nginx/limits.conf;

        # nginx is the edge: X-Forwarded-For is overwritten with the client address (the socket
        # peer, or with the real_ip switch on the address the trusted outer proxy reported; a
        # client-sent value is dropped); the API trusts it only from this container's address.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Short: the kernel completes the TCP handshake even when the API is busy, so a connect
        # that takes longer is an address with no container behind it (api being recreated).
        proxy_connect_timeout 2s;
        # A failed connection (api restarting, a dead keep-alive connection) or a timeout is
        # retried for idempotent requests only: without `non_idempotent` nginx never sends a
        # POST / PATCH / DELETE (uploads, curation) twice. At most 3 tries within 10 s.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # Server-sent events: no buffering, long reads (the API pings every 15 s and closes
        # streams after 30 min).
        location ~ ^/api/v2/(papers|images)/[^/]+/events$ {
            proxy_pass http://marcus_api;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        # The upload routes (POST /api/v2/papers, POST /api/v2/images; GET of the same paths
        # lands here too and is not counted): 21 MB bodies, counted by `limit_conn uploads`.
        location = /api/v2/papers {
            client_max_body_size 21m;
            proxy_pass http://marcus_api;
            # Whole upload received here first, so slow clients never hold an API worker.
            proxy_request_buffering on;
            proxy_read_timeout 120s;
        }

        location = /api/v2/images {
            client_max_body_size 21m;
            proxy_pass http://marcus_api;
            proxy_request_buffering on;
            proxy_read_timeout 120s;
        }

        # The COCONUT relay: the three exact locations below, nothing else. Every other path
        # under the prefix is nginx's own 404 (never COCONUT, never the API). Checks in each
        # location, in this order: POST only (405), no query (400), a JSON body only (415;
        # a cross-site form cannot send one), the body size (413), the rate limits (429).
        location ^~ /api/v2/coconut/ {
            access_log /dev/stdout coconut;

            # Only these headers go to COCONUT: no cookie (the owner cookie has Path=/api/v2),
            # no client address, no Referer or Origin.
            proxy_pass_request_headers off;
            proxy_set_header Host coconut.naturalproducts.net;
            proxy_set_header Content-Type $content_type;
            proxy_set_header Accept "application/json";
            proxy_set_header Authorization $coconut_authorization;  # empty = not sent
            proxy_set_header User-Agent "MARCUS (https://marcus.decimer.ai)";

            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name coconut.naturalproducts.net;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 4;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_redirect off;
            proxy_max_temp_file_size 0;  # a huge answer is never spooled to /tmp

            # Back to the browser: status, body, Content-Type (and length) only. The njs filter
            # drops every other upstream header; these hides take COCONUT's versions of the
            # headers nginx sets itself out first (and the dangerous ones, should njs not run).
            proxy_hide_header Set-Cookie;
            proxy_hide_header Location;
            proxy_hide_header Refresh;
            proxy_hide_header Link;
            proxy_hide_header Cache-Control;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Expose-Headers;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Cross-Origin-Resource-Policy;
            proxy_hide_header Strict-Transport-Security;
            js_header_filter coconut.onlyStatusAndBody;

            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Cache-Control "no-store" always;

            # coconutApi.ts coconutLogin: {email, password}; the client waits 30 s.
            location = /api/v2/coconut/auth/login {
                if ($request_method != POST) { return 405; }
                if ($is_args) { return 400; }
                if ($content_type !~* "^application/json(;.*)?$") { return 415; }
                client_max_body_size 8k;
                limit_req zone=coconut_login burst=3 nodelay;
                limit_req zone=coconut_login_all burst=10 nodelay;
                proxy_read_timeout 30s;
                proxy_pass https://coconut/api/auth/login;
            }

            # coconutApi.ts submitReports: up to 50 reports per request (a 413 here makes the
            # client halve the chunk); the client waits 60 s.
            location = /api/v2/coconut/reports/mutate {
                if ($request_method != POST) { return 405; }
                if ($is_args) { return 400; }
                if ($content_type !~* "^application/json(;.*)?$") { return 415; }
                client_max_body_size 2m;
                limit_req zone=coconut_mutate burst=20 nodelay;
                proxy_read_timeout 60s;
                proxy_pass https://coconut/api/reports/mutate;
            }

            # coconutDoi.ts: the DOI tag search, no login; the client waits 10 s.
            location = /api/v2/coconut/search {
                if ($request_method != POST) { return 405; }
                if ($is_args) { return 400; }
                if ($content_type !~* "^application/json(;.*)?$") { return 415; }
                client_max_body_size 8k;
                limit_req zone=coconut_search burst=10 nodelay;
                proxy_read_timeout 10s;
                proxy_pass https://coconut/api/search;
            }

            return 404;
        }

        location /api/v2/ {
            client_max_body_size 1m;
            proxy_pass http://marcus_api;
            proxy_request_buffering on;
            proxy_read_timeout 120s;
            # A paper's JSON carries every prediction's molfile and is read again on live
            # updates; depictions are SVG: both compress several times over. Never on the
            # events location above (a stream must not wait in a gzip buffer).
            gzip on;
            gzip_proxied any;
            gzip_types application/json image/svg+xml;
            gzip_min_length 1024;
            gzip_vary on;
        }

        # The web UI (frontend-v2): the pre-rendered pages, the tool shell, its assets and the
        # Ketcher editor, each location with its own full header set (CSP, frame options, ...).
        # Baked into the nginx image (frontend-v2/Dockerfile); it also answers every other path
        # with the pre-rendered 404 page.
        include /etc/nginx/marcus/ui-locations.conf;
    }
}
