# MARCUS v2 edge proxy (nginxinc/nginx-unprivileged: runs as uid 101, listens on 8080).
# The only service that publishes a port. Read-only root filesystem: pid and temp files in /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    server_tokens off;  # "Server: nginx", no version

    log_format edge '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    '$request_time rid=$request_id';
    access_log /dev/stdout edge;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 65s;
    client_header_timeout 15s;
    client_body_timeout 20s;  # between two reads: a trickled body holds its buffer less long
    send_timeout 60s;

    # The API refuses > 20 MB itself, but only after the body is spooled: this is the guard.
    client_max_body_size 21m;
    client_body_buffer_size 1m;

    # Bodies are buffered here (memory: /tmp is a sized tmpfs) before the API's rate limits
    # see them, so the number of requests in progress per client address is capped: all
    # requests (perip; SSE streams and image GETs included) and uploads (POST /papers and
    # /images, whose bodies are up to 21 MB). Over the cap: 429. Behind the outer proxy every
    # client is that proxy's address unless the real_ip switch below is on (README switch day).
    # Switch day (README): behind the outer proxy, the client address comes from X-Forwarded-For
    # sent by the proxy addresses in MARCUS_REAL_IP_FROM (docker/nginx-edge.sh writes this file;
    # empty, i.e. off, by default). It must come before everything that reads $remote_addr.
    include /tmp/nginx/real_ip.conf;

    limit_conn_zone $binary_remote_addr zone=perip:10m;
    map "$request_method:$uri" $upload_key {
        "~^POST:/api/v2/(papers|images)$" $binary_remote_addr;
        default "";  # not counted
    }
    limit_conn_zone $upload_key zone=uploads:10m;
    limit_conn_status 429;
    limit_conn_log_level warn;

    # Security headers, the same values as marcus.api.security.SECURITY_HEADERS. nginx adds
    # each one only when the upstream did not send it, so API responses keep their own values
    # (e.g. the docs CSP) and nginx's own replies (413, 502, 504) still carry them.
    map $upstream_http_content_security_policy $sec_csp {
        "" "default-src 'none'; frame-ancestors 'none'";
        default "";
    }
    map $upstream_http_x_content_type_options $sec_xcto {
        "" "nosniff";
        default "";
    }
    map $upstream_http_x_frame_options $sec_xfo {
        "" "DENY";
        default "";
    }
    map $upstream_http_referrer_policy $sec_rp {
        "" "no-referrer";
        default "";
    }
    map $upstream_http_cross_origin_resource_policy $sec_corp {
        "" "same-origin";
        default "";
    }

    # Docker's DNS; `resolve` re-resolves "api" when its container is recreated (new address)
    # instead of keeping the address nginx saw at startup (nginx >= 1.27.3). valid=1s: a
    # recreated api's new address (or its absence while it is gone) is cached for a second only.
    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 2s;

    upstream marcus_api {
        zone marcus_api 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        add_header Content-Security-Policy $sec_csp always;
        add_header X-Content-Type-Options $sec_xcto always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_rp always;
        add_header Cross-Origin-Resource-Policy $sec_corp always;

        # limit_conn perip / uploads: values from MARCUS_NGINX_CONN_PER_IP (64) and
        # MARCUS_NGINX_UPLOADS_PER_IP (4), written by docker/nginx-edge.sh at container start.
        include /tmp/nginx/limits.conf;

        # nginx is the edge: X-Forwarded-For is overwritten with the client address (the socket
        # peer, or with the real_ip switch on the address the trusted outer proxy reported; a
        # client-sent value is dropped); the API trusts it only from this container's address.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Short: the kernel completes the TCP handshake even when the API is busy, so a connect
        # that takes longer is an address with no container behind it (api being recreated).
        proxy_connect_timeout 2s;
        # A failed connection (api restarting, a dead keep-alive connection) or a timeout is
        # retried for idempotent requests only: without `non_idempotent` nginx never sends a
        # POST / PATCH / DELETE (uploads, curation) twice. At most 3 tries within 10 s.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # Server-sent events: no buffering, long reads (the API pings every 15 s and closes
        # streams after 30 min).
        location ~ ^/api/v2/papers/[^/]+/events$ {
            proxy_pass http://marcus_api;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location /api/v2/ {
            proxy_pass http://marcus_api;
            # Whole upload received here first, so slow clients never hold an API worker.
            proxy_request_buffering on;
            proxy_read_timeout 120s;
        }

        location / {
            return 404;
        }
    }
}
