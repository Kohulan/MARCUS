# Override: fake segment and OCSR workers for fast end-to-end and fairness tests.
#
#   docker compose -p marcus-v2 -f docker-compose.yml -f docker-compose.fake.yml up -d --build
#
# Fake engines: segmentation 2 s per page (2 segments per page), OCSR 1 s per segment, paper
# annotation 2 s per paper (the fake annotator: values picked from the text by fixed rules), R-group
# rows 2 s per scaffold (the fake reader: "3a: R1 = OMe, R2 = H" definitions from the page text).
# The fake workers run the api image (it already has everything they import) with exactly
# their own handler module (--include). Concurrency 1 each = the q.segment / q.fake / q.llm /
# q.rgroup slots. No model server: the GPU stack's one llama-server (two slots, one per queue)
# is stood in for by worker-fake-annotate (q.llm) and worker-fake-rgroup (q.rgroup).
#
# Test-only relaxations on the API: all e2e traffic comes from one client IP (the Docker
# gateway), so the per-IP limits (new owners per hour, active papers, requests per minute)
# are raised; per-owner limits and every other check stay as in docker-compose.yml.
# YAML anchors do not cross files, so the shared worker settings are repeated here.
#
# COCONUT: a fake COCONUT (tests/fake_coconut/server.py) holds the name
# coconut.naturalproducts.net on the internal network, and nginx trusts only the fake's test CA
# (its CA bundle is replaced). The relay in docker/nginx.conf runs unchanged (fixed host, TLS
# verification, SNI); nothing is ever sent to the real COCONUT: a request that somehow reached
# it would fail certificate verification before any HTTP is sent.

# The two fake model workers (worker-fake-annotate, worker-fake-rgroup): the same settings, each
# with its own command and engine environment.
x-llm-worker: &llm-worker
  image: marcus-v2-api:local
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - internal
  volumes:
    - data:/data:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    api-migrate:
      condition: service_completed_successfully
  environment: &llm-env
    MARCUS_DATABASE_URL: postgresql+asyncpg://marcus:${POSTGRES_PASSWORD}@postgres:5432/marcus
    MARCUS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    MARCUS_DATA_ROOT: /data
    MARCUS_ENABLE_FAKE_ENGINES: "1"

services:
  # The real DECIMER segmenter is replaced by worker-fake-segment below (both would consume
  # q.segment). A profile that is never activated keeps it from being built or started.
  worker-segment:
    profiles: ["real-segment"]
  # The real DECIMER OCSR worker is not part of the fake stack either.
  worker-decimer:
    profiles: ["real-decimer"]
  # Nor are the real torch OCSR workers (MolNexTR, MolScribe).
  worker-molnextr:
    profiles: ["real-molnextr"]
  worker-molscribe:
    profiles: ["real-molscribe"]

  api:
    environment:
      MARCUS_ENABLE_FAKE_ENGINES: "1"
      # The fake segmenter's version (FakeSegmenter.version): the segmentation cache key.
      MARCUS_SEG_VERSION: fake-1
      MARCUS_EXPECTED_QUEUES: q.cpu,q.tools,q.segment,q.fake,q.llm,q.rgroup
      MARCUS_ANNOTATE_ENABLED: "1"
      MARCUS_RGROUP_ENABLED: "1"
      MARCUS_IP_MAX_NEW_OWNERS_PER_HOUR: "1000"
      MARCUS_IP_MAX_ACTIVE_PAPERS: "100"
      MARCUS_RATE_LIMIT_IP_PER_MIN: "6000"

  worker-cpu:
    environment:
      MARCUS_SEG_VERSION: fake-1

  worker-fake-segment:
    image: marcus-v2-api:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    command: ["celery", "-A", "marcus.core.celery_app:celery_app", "worker", "-Q", "q.segment",
              "-c", "1", "--pool", "prefork", "--include", "marcus.workers.segment",
              "-n", "fake-segment@%h", "--loglevel", "INFO"]
    environment:
      MARCUS_DATABASE_URL: postgresql+asyncpg://marcus:${POSTGRES_PASSWORD}@postgres:5432/marcus
      MARCUS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MARCUS_DATA_ROOT: /data
      MARCUS_ENABLE_FAKE_ENGINES: "1"
      MARCUS_SEGMENTER: fake
      MARCUS_SEG_VERSION: fake-1
      MARCUS_FAKE_SEGMENTS_PER_PAGE: "2"
      MARCUS_FAKE_SEGMENT_DELAY_S: "2"

  worker-fake-ocsr:
    image: marcus-v2-api:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    command: ["celery", "-A", "marcus.core.celery_app:celery_app", "worker", "-Q", "q.fake",
              "-c", "1", "--pool", "prefork", "--include", "marcus.workers.ocsr",
              "-n", "fake-ocsr@%h", "--loglevel", "INFO"]
    environment:
      MARCUS_DATABASE_URL: postgresql+asyncpg://marcus:${POSTGRES_PASSWORD}@postgres:5432/marcus
      MARCUS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MARCUS_DATA_ROOT: /data
      MARCUS_ENABLE_FAKE_ENGINES: "1"
      MARCUS_FAKE_OCSR_DELAY_S: "1"

  worker-fake-annotate:
    <<: *llm-worker
    command: ["celery", "-A", "marcus.core.celery_app:celery_app", "worker", "-Q", "q.llm",
              "-c", "1", "--pool", "prefork", "--include", "marcus.workers.annotate",
              "-n", "fake-annotate@%h", "--loglevel", "INFO"]
    environment:
      <<: *llm-env
      MARCUS_ANNOTATOR: fake
      MARCUS_FAKE_ANNOTATE_DELAY_S: "2"

  # The fake R-group reader on its own queue, as worker-rgroup in the GPU override.
  worker-fake-rgroup:
    <<: *llm-worker
    command: ["celery", "-A", "marcus.core.celery_app:celery_app", "worker", "-Q", "q.rgroup",
              "-c", "1", "--pool", "prefork", "--include", "marcus.workers.rgroups",
              "-n", "fake-rgroup@%h", "--loglevel", "INFO"]
    environment:
      <<: *llm-env
      MARCUS_RGROUP_READER: fake
      MARCUS_FAKE_RGROUP_DELAY_S: "2"

  fake-coconut:
    image: marcus-v2-api:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Internal only (no route out), under COCONUT's name: Docker's DNS answers it with this
    # container for everyone on the network, nginx's relay included.
    networks:
      internal:
        aliases:
          - coconut.naturalproducts.net
    # TLS files are made at the first start into a volume (tests/fake_coconut/gen-certs.sh), so
    # no key is stored in git; /data is the image's folder owned by uid 10001.
    environment:
      MARCUS_FAKE_TLS_DIR: /data
    volumes:
      - ./tests/fake_coconut:/fake:ro
      - fake-coconut-tls:/data
    command: ["sh", "-c", "[ -s /data/key.pem ] || sh /fake/gen-certs.sh /data; exec python /fake/server.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 443), 2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    volumes:
      # Only the fake's test CA (ca-certificates.crt in the volume), nothing else.
      - fake-coconut-tls:/etc/ssl/certs:ro
    # The fake holds COCONUT's name before nginx first resolves it.
    depends_on:
      fake-coconut:
        condition: service_healthy

volumes:
  fake-coconut-tls:
