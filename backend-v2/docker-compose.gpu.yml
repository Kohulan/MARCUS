# Override: the four model workers and the MARCUS model (llama-server) on the GPU (production
# host: one 32 GB card).
#
#   docker compose -p marcus-v2 -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#   (add -f docker-compose.monitoring.yml last for Prometheus/Grafana; Prometheus then also
#   scrapes dcgm-exporter:9400)
#
# Images: the CUDA variants (build arg VARIANT=cuda) under their own tags, so the CPU images
# (:local) stay as they are. marcus-v2-tf:cuda is v1's runtime (nvidia/cuda:11.8.0-cudnn8 base,
# CUDA 12.x wheels, cuDNN 8.9.6); marcus-v2-torch:cuda is torch 2.10.0+cu128 as v1
# (docker/MODEL_PINS.md).
#
# GPU memory budgets (one card, four processes; tests/deploy keeps the sum under 20 GB):
#   worker-segment    TensorFlow  MARCUS_GPU_MEM_MB 2048 (one logical device, memory_limit). Measured on the
#                     jarvis V100 (D4 fix round 1): TF allocator peak 896-982 MiB over 44 pages at 300 dpi
#                     (synth_015, synth_190, two gold-set papers), the same speed and segments with a 1024 MiB
#                     cap; 2048 is about twice the peak (the spec's first guess was 6 GB).
#   worker-decimer    TensorFlow  MARCUS_GPU_MEM_MB 4096
#   worker-molnextr   torch       MARCUS_TORCH_MEM_FRACTION 0.09 (about 2.9 GB of 32 GB)
#   worker-molscribe  torch       MARCUS_TORCH_MEM_FRACTION 0.09, on the GPU
#                     (MARCUS_MOLSCRIBE_DEVICE cuda here; v1 and the CPU stack run it on cpu).
#                     Spec §3 allows the move only without loss on the fixture judge: D4 (jarvis
#                     V100, 2026-11-17) gave the same SMILES on 205 of 205 fixture crops as cpu,
#                     the same exact matches, and 0.66 s instead of 1.08 s per structure
#                     (judges/results/2026-11-17-gpu-session.md).
#   llama-server      the MARCUS model (Q8_0 GGUF, 9.5 GB) fully on the GPU, 8192-token context,
#                     one request at a time: 8.9 GB measured on the jarvis V100 (2026-11-20;
#                     llama.cpp has no cap; the size is the model plus its context). tests/deploy
#                     counts it on top of the 20 GB above.
# The budgets cap the frameworks' allocators; every process's CUDA context (a few hundred MB)
# comes on top. Each value can be changed from the environment without editing this file.
#
# Paper annotation (owner decision 2026-11-20): llama-server runs in its own container on its own
# internal network `llm`, shared only with worker-llm (no port published, no internet, no other
# container can reach it), the GGUF mounted read-only from the
# host (MARCUS_LLM_GGUF; never copied into an image). It must be readable by the container user
# (MARCUS_LLM_USER, default 10001:10001; e.g. the file owner's "$(id -u):$(id -g)"). worker-llm
# (the api image) consumes q.llm and calls it; the API offers annotation (MARCUS_ANNOTATE_ENABLED)
# and /ready expects q.llm. A different model file means new MARCUS_ANNOTATE_MODEL(_VERSION).
#
# Host: NVIDIA driver with CUDA 12.8 support and the NVIDIA Container Toolkit; the card in compute
# mode DEFAULT (several processes share it: ops/systemd/nvidia-compute-default.service).

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

x-tf-cuda: &tf-cuda
  build:
    context: .
    dockerfile: docker/Dockerfile.tf
    target: runtime
    args:
      VARIANT: cuda
  image: marcus-v2-tf:cuda

x-torch-cuda: &torch-cuda
  build:
    context: .
    dockerfile: docker/Dockerfile.torch
    target: runtime
    args:
      VARIANT: cuda
  image: marcus-v2-torch:cuda

services:
  worker-segment:
    <<: [*gpu, *tf-cuda]
    environment:
      MARCUS_GPU_MEM_MB: ${MARCUS_SEGMENT_GPU_MEM_MB:-2048}

  worker-decimer:
    <<: [*gpu, *tf-cuda]
    environment:
      MARCUS_GPU_MEM_MB: ${MARCUS_DECIMER_GPU_MEM_MB:-4096}
      # Hand-drawn model at start too: its first request then answers in seconds, not ~28 s.
      MARCUS_PRELOAD_DECIMER_HAND: ${MARCUS_PRELOAD_DECIMER_HAND:-1}

  worker-molnextr:
    <<: [*gpu, *torch-cuda]
    environment:
      MARCUS_TORCH_MEM_FRACTION: ${MARCUS_MOLNEXTR_TORCH_MEM_FRACTION:-0.09}

  worker-molscribe:
    <<: [*gpu, *torch-cuda]
    environment:
      MARCUS_TORCH_MEM_FRACTION: ${MARCUS_MOLSCRIBE_TORCH_MEM_FRACTION:-0.09}
      MARCUS_MOLSCRIBE_DEVICE: ${MARCUS_MOLSCRIBE_DEVICE:-cuda}

  # GPU metrics (utilisation, memory, temperature, ...) on :9400 for Prometheus, internal network
  # only (no published port). Default capabilities: without CAP_SYS_ADMIN the profiling (DCP)
  # metrics are off; the basic DCGM fields need no extra privilege.
  dcgm-exporter:
    <<: *gpu
    # Pinned at 4.2.3: 4.5.2 stops collecting GPU metrics unless it runs as root ("Host engine
    # is running as non-root", seen on jarvis 2026-11-21), and this container runs without root.
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.2.3-4.1.1-ubuntu22.04
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  api:
    environment:
      MARCUS_ANNOTATE_ENABLED: "1"
      MARCUS_EXPECTED_QUEUES: ${MARCUS_EXPECTED_QUEUES:-q.cpu,q.tools,q.segment,q.decimer,q.molnextr,q.molscribe,q.llm}

  # The MARCUS model: llama.cpp llama-server (docker/Dockerfile.llama, built at the commit the GGUF
  # was converted with). Greedy decoding and the 11-key grammar come with each request
  # (marcus.workers.annotate.llama); here: thinking off, one slot, the whole model on the GPU.
  llama-server:
    <<: *gpu
    build:
      context: .
      dockerfile: docker/Dockerfile.llama
      args:
        VARIANT: cuda
        CUDA_ARCH: "70"
    image: marcus-v2-llama:cuda-b12554
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: ${MARCUS_LLM_USER:-10001:10001}
    networks:
      - llm
    volumes:
      - type: bind
        source: ${MARCUS_LLM_GGUF:-/srv/marcus/models/qwen3.5-9b-marcus-v1-Q8_0.gguf}
        target: /models/marcus.gguf
        read_only: true
        bind:
          create_host_path: false
    command: ["--model", "/models/marcus.gguf", "--alias", "qwen3.5-9b-marcus-v1",
              "--host", "0.0.0.0", "--port", "8080", "--parallel", "1", "--ctx-size", "8192",
              "--n-gpu-layers", "999", "--jinja", "--reasoning", "off", "--no-webui"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 300s
      retries: 3
    mem_limit: 16g

  # annotate steps (q.llm): ONE prefork process (= q.llm slots); it only reads the paper's text
  # and calls llama-server, so it runs the api image with the data volume read-only.
  worker-llm:
    image: marcus-v2-api:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal
      - llm
    volumes:
      - data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
      llama-server:
        condition: service_healthy
    command: ["celery", "-A", "marcus.core.celery_app:celery_app", "worker", "-Q", "q.llm",
              "-c", "1", "--pool", "prefork", "--include", "marcus.workers.annotate",
              "-n", "llm@%h", "--loglevel", "INFO"]
    environment:
      MARCUS_DATABASE_URL: postgresql+asyncpg://marcus:${POSTGRES_PASSWORD}@postgres:5432/marcus
      MARCUS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MARCUS_DATA_ROOT: /data
      MARCUS_ANNOTATOR: llama
      MARCUS_ANNOTATOR_URL: http://llama-server:8080
      MARCUS_ANNOTATE_MODEL: ${MARCUS_ANNOTATE_MODEL:-qwen3.5-9b-marcus-v1}
      MARCUS_ANNOTATE_MODEL_VERSION: ${MARCUS_ANNOTATE_MODEL_VERSION:-Q8_0 llama.cpp b12554}
    mem_limit: 1g

networks:
  # llama-server and worker-llm only (tests/deploy): no route out, no other member.
  llm:
    internal: true
