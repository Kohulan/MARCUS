<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="coffee">
  <title>coffee</title>
  <!-- steam: two wisps rise and fade, out of step -->
  <g fill="none" stroke="#8A8F86" stroke-width="2" stroke-linecap="round">
    <path d="M11 11c-1.4-1.8 1.4-3 0-5">
      <animateTransform attributeName="transform" type="translate" values="0 2;0 -2" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M17 11c-1.4-1.8 1.4-3 0-5">
      <animateTransform attributeName="transform" type="translate" values="0 2;0 -2" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- the mug wobbles like the one in the site footer -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 15 28;-4 15 28;3 15 28;0 15 28" keyTimes="0;.3;.6;1" dur="2.6s" repeatCount="indefinite"/>
    <path d="M5 14h18v7a7 7 0 0 1-7 7h-4a7 7 0 0 1-7-7z" fill="#FA3600"/>
    <path d="M23 16h2.5a3.5 3.5 0 0 1 0 7H23" fill="none" stroke="#FA3600" stroke-width="2.6"/>
  </g>
</svg>
