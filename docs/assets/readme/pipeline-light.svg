<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d"><title id="t">How MARCUS works</title><desc id="d">PDF, then segmentation, recognition by four engines, curation by a person, and submission to COCONUT.</desc><style>@font-face{font-family:G;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:M;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
.draw{stroke-dasharray:1;animation:draw var(--d,800ms) cubic-bezier(0.22, 1, 0.36, 1) var(--t,0ms) backwards}
.fade{animation:fade var(--d,600ms) cubic-bezier(0.22, 1, 0.36, 1) var(--t,0ms) backwards}
.rise{animation:rise var(--d,600ms) cubic-bezier(0.22, 1, 0.36, 1) var(--t,0ms) backwards}
.fall{transform-box:fill-box;animation:fall var(--d,760ms) cubic-bezier(.5,0,.75,0) var(--t,0ms) backwards,land 260ms cubic-bezier(0.22, 1, 0.36, 1) calc(var(--t,0ms) + var(--d,760ms)) backwards;transform-origin:50% 90%}
.slide{animation:slide 560ms cubic-bezier(0.22, 1, 0.36, 1) var(--t,0ms) backwards}
.grow{transform-box:fill-box;transform-origin:left;animation:grow var(--d,600ms) cubic-bezier(0.22, 1, 0.36, 1) var(--t,0ms) backwards}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 520ms cubic-bezier(0.22, 1, 0.36, 1) var(--t,0ms) backwards}
.stamp{transform-box:fill-box;transform-origin:center;animation:stamp 420ms cubic-bezier(.3,1.4,.5,1) var(--t,0ms) backwards}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fall{from{opacity:0;transform:translateY(-70px)}8%{opacity:1}}
@keyframes land{from{transform:scale(1.08,.86)}}
@keyframes slide{from{opacity:0;transform:translateX(-12px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pop{from{opacity:0;transform:rotate(-90deg) scale(.3)}}
@keyframes stamp{from{opacity:0;transform:scale(1.8) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="1280" height="300" fill="#F4F3EA"/><line x1="16" y1="16" x2="16" y2="284" stroke="#B9BCB2" stroke-width="1.2" pathLength="1" class="draw" style="--t:80ms;--d:400ms"/><line x1="1264" y1="16" x2="16" y2="16" stroke="#B9BCB2" stroke-width="1.2" pathLength="1" class="draw" style="--t:220ms;--d:760ms"/><line x1="1264" y1="284" x2="1264" y2="16" stroke="#B9BCB2" stroke-width="1.2" pathLength="1" class="draw" style="--t:360ms;--d:400ms"/><line x1="16" y1="284" x2="1264" y2="284" stroke="#B9BCB2" stroke-width="1.2" pathLength="1" class="draw" style="--t:500ms;--d:760ms"/><g transform="translate(140.8 104)"><path d="M-22 -30h30l14 14v46h-44z" fill="none" stroke="#1C211D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="--t:300ms;--d:520ms"/><path d="M8 -30v14h14" fill="none" stroke="#1C211D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="--t:390ms;--d:520ms"/><path d="M-14 -4h28M-14 6h28M-14 16h18" fill="none" stroke="#1C211D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="--t:480ms;--d:520ms"/></g><text x="140.8" y="184.0" font-family="G" font-weight="700" font-size="22" fill="#1C211D" text-anchor="middle" letter-spacing="-0.02em" class="rise" style="--t:500ms">PDF</text><text x="140.8" y="214.0" font-family="M" font-weight="400" font-size="12" fill="#5E625B" text-anchor="middle" letter-spacing="0.02em" class="fade" style="--t:600ms">A journal article,</text><text x="140.8" y="232.0" font-family="M" font-weight="400" font-size="12" fill="#5E625B" text-anchor="middle" letter-spacing="0.02em" class="fade" style="--t:600ms">up to 20 MB</text><line x1="265.6" y1="16" x2="265.6" y2="284" stroke="#D9DACF" stroke-width="1" pathLength="1" class="draw" style="--t:280ms;--d:500ms"/><g class="pop" style="--t:600ms"><circle cx="265.6" cy="104" r="11" fill="#F4F3EA" stroke="#B9BCB2"/><path d="M262.6 99l5 5l-5 5" fill="none" stroke="#FA3600" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(390.4 104)"><path d="M-22 -30h30l14 14v46h-44z" fill="none" stroke="#1C211D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="--t:720ms;--d:520ms"/><path d="M8 -30v14h14" fill="none" stroke="#1C211D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="--t:810ms;--d:520ms"/><path d="M-15 -8h30v28h-30z" fill="none" stroke="#FA3600" stroke-width="2" pathLength="1" class="draw" style="--t:900ms;--d:520ms"/><path d="M0 -2l7 4v8l-7 4l-7-4v-8z" fill="none" stroke="#1C211D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="--t:990ms;--d:520ms"/></g><text x="390.4" y="184.0" font-family="G" font-weight="700" font-size="22" fill="#1C211D" text-anchor="middle" letter-spacing="-0.02em" class="rise" style="--t:920ms">Segment</text><text x="390.4" y="214.0" font-family="M" font-weight="400" font-size="12" fill="#5E625B" text-anchor="middle" letter-spacing="0.02em" class="fade" style="--t:1020ms">DECIMER Segmentation finds</text><text x="390.4" y="232.0" font-family="M" font-weight="400" font-size="12" fill="#5E625B" text-anchor="middle" letter-spacing="0.02em" class="fade" style="--t:1020ms">every structure drawing</text><line x1="515.2" y1="16" x2="515.2" y2="284" stroke="#D9DACF" stroke-width="1" pathLength="1" class="draw" style="--t:360ms;--d:500ms"/><g class="pop" style="--t:1020ms"><circle cx="515.2" cy="104" r="11" fill="#F4F3EA" stroke="#B9BCB2"/><path d="M512.2 99l5 5l-5 5" fill="none" stroke="#FA3600" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(640.0 104)"><path d="M-18 -18l12 7v14l-12 7l-12-7v-14z" fill="none" stroke="#1C211D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="--t:1140ms;--d:520ms"/><path d="M-24 -6v10M-12 -10l8 4" fill="none" stroke="#1C211D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="--t:1230ms;--d:520ms"/><path d="M2 -4h10M8 -9l5 5l-5 5" fill="none" stroke="#FA3600" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="--t:1320ms;--d:520ms"/><path d="M18 -14h14M18 -4h10M18 6h14" fill="none" stroke="#1C211D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="--t:1410ms;--d:520ms"/></g><text x="640.0" y="184.0" font-family="G" font-weight="700" font-size="22" fill="#1C211D" text-anchor="middle" letter-spacing="-0.02em" class="rise" style="--t:1340ms">Recognise</text><text x="640.0" y="214.0" font-family="M" font-weight="400" font-size="12" fill="#5E625B" text-anchor="middle" letter-spacing="0.02em" class="fade" style="--t:1440ms">Four engines turn each</text><text x="640.0" y="232.0" font-family="M" font-weight="400" font-size="12" fill="#5E625B" text-anchor="middle" letter-spacing="0.02em" class="fade" style="--t:1440ms">drawing into SMILES</text><line x1="764.8" y1="16" x2="764.8" y2="284" stroke="#D9DACF" stroke-width="1" pathLength="1" class="draw" style="--t:440ms;--d:500ms"/><g class="pop" style="--t:1440ms"><circle cx="764.8" cy="104" r="11" fill="#F4F3EA" stroke="#B9BCB2"/><path d="M761.8 99l5 5l-5 5" fill="none" stroke="#FA3600" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(889.6 104)"><circle r="24" fill="none" stroke="#2D7A46" stroke-width="2" pathLength="1" class="draw" style="--t:1560ms;--d:700ms"/><circle r="19" fill="none" stroke="#2D7A46" stroke-width="1" pathLength="1" class="draw" style="--t:1650ms;--d:700ms"/><path d="M-9 0l6 6l12-13" fill="none" stroke="#2D7A46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="--t:1830ms;--d:520ms"/></g><text x="889.6" y="184.0" font-family="G" font-weight="700" font-size="22" fill="#1C211D" text-anchor="middle" letter-spacing="-0.02em" class="rise" style="--t:1760ms">Curate</text><text x="889.6" y="214.0" font-family="M" font-weight="400" font-size="12" fill="#5E625B" text-anchor="middle" letter-spacing="0.02em" class="fade" style="--t:1860ms">You accept, fix or reject,</text><text x="889.6" y="232.0" font-family="M" font-weight="400" font-size="12" fill="#5E625B" text-anchor="middle" letter-spacing="0.02em" class="fade" style="--t:1860ms">one by one or in bulk</text><line x1="1014.4" y1="16" x2="1014.4" y2="284" stroke="#D9DACF" stroke-width="1" pathLength="1" class="draw" style="--t:520ms;--d:500ms"/><g class="pop" style="--t:1860ms"><circle cx="1014.4" cy="104" r="11" fill="#F4F3EA" stroke="#B9BCB2"/><path d="M1011.4 99l5 5l-5 5" fill="none" stroke="#FA3600" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(1139.2 104)"><ellipse cy="-18" rx="22" ry="7" fill="none" stroke="#1C211D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="--t:1980ms;--d:520ms"/><path d="M-22 -18v32c0 4 10 7 22 7s22-3 22-7v-32" fill="none" stroke="#1C211D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="--t:2070ms;--d:520ms"/><path d="M-22 -2c0 4 10 7 22 7s22-3 22-7" fill="none" stroke="#1C211D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="--t:2160ms;--d:520ms"/><path d="M30 10v-26M24 -10l6-6l6 6" fill="none" stroke="#FA3600" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="--t:2250ms;--d:520ms"/></g><text x="1139.2" y="184.0" font-family="G" font-weight="700" font-size="22" fill="#1C211D" text-anchor="middle" letter-spacing="-0.02em" class="rise" style="--t:2180ms">Submit</text><text x="1139.2" y="214.0" font-family="M" font-weight="400" font-size="12" fill="#5E625B" text-anchor="middle" letter-spacing="0.02em" class="fade" style="--t:2280ms">Accepted structures</text><text x="1139.2" y="232.0" font-family="M" font-weight="400" font-size="12" fill="#5E625B" text-anchor="middle" letter-spacing="0.02em" class="fade" style="--t:2280ms">go to COCONUT</text></svg>
